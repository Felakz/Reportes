services:
  db:
    image: postgres:16-alpine
    container_name: reportes-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: reportes
      POSTGRES_USER: reportes_app
      POSTGRES_PASSWORD: reportes_local
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reportes_app -d reportes"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: reportes-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      DATABASE_URL: postgres://reportes_app:reportes_local@db:5432/reportes
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: reportes-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
